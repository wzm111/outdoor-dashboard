<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>户外助手 · 看板</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path fill='%2322c55e' d='M50 15L20 75h60L50 15zm0 12l20 42H30l20-42z'/></svg>" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 登录 / 配置面板 -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1><span class="brand-icon" aria-hidden="true"></span>户外助手看板</h1>
      <p class="auth-sub">输入访问密钥连接你的 Supabase 数据</p>
      <label>
        API 地址
        <input id="api-url" type="url" autocomplete="off"
               placeholder="https://xxx.supabase.co/functions/v1" />
      </label>
      <label>
        访问密钥 (api_secret)
        <input id="api-secret" type="password" autocomplete="off"
               placeholder="你的长期 service 密钥" />
      </label>
      <label class="remember">
        <input id="remember" type="checkbox" checked />
        在本浏览器记住密钥（仅存本地 localStorage）
      </label>
      <button id="connect-btn" type="button">连接</button>
      <p id="auth-error" class="auth-error" hidden></p>
      <p class="auth-note">
        🔒 密钥只保存在你的浏览器本地，绝不上传或写入代码仓库。
        清除浏览器数据即可移除。
      </p>
    </div>
  </div>

  <!-- 主看板 -->
  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true"></span>户外助手</div>
      <nav class="tabs" id="tabs">
        <button type="button" class="tab active" data-view="overview">总览</button>
        <button type="button" class="tab" data-view="activities">活动</button>
        <button type="button" class="tab" data-view="body">身体趋势</button>
        <button type="button" class="tab" data-view="gear">装备</button>
        <button type="button" class="tab" data-view="routes">路线</button>
        <button type="button" class="tab" data-view="plans">计划</button>
        <button type="button" class="tab" data-view="reports">报告</button>
      </nav>
      <div class="topbar-actions">
        <span id="sync-status" class="sync-status"></span>
        <button type="button" id="refresh-btn" class="icon-btn" title="刷新" aria-label="刷新"></button>
        <button type="button" id="logout-btn" class="icon-btn" title="断开 / 清除密钥" aria-label="断开 / 清除密钥"></button>
      </div>
    </header>

    <main id="views" class="views">
      <section class="view" data-view="overview"></section>
      <section class="view" data-view="activities" hidden></section>
      <section class="view" data-view="body" hidden></section>
      <section class="view" data-view="gear" hidden></section>
      <section class="view" data-view="routes" hidden></section>
      <section class="view" data-view="plans" hidden></section>
      <section class="view" data-view="reports" hidden></section>
    </main>

    <footer class="footer">
      <span id="data-meta"></span>
      <span class="footer-actions">
        <button type="button" id="export-backup-btn" class="link-btn" title="导出 JSON 应急备份">导出备份</button>
        <button type="button" id="import-backup-btn" class="link-btn" title="导入 JSON 应急备份">导入备份</button>
        <input type="file" id="import-backup-input" accept="application/json,.json" hidden />
      </span>
    </footer>
  </div>

  <div id="loading" class="loading" hidden>
    <div class="spinner"></div>
    <span>加载数据中…</span>
  </div>

  <script src="version.js?v=34.5"></script>
  <script src="utils.js?v=34.5"></script>
  <script src="state.js?v=34.5"></script>
  <script src="idb.js?v=34.5"></script>
  <script src="api.js?v=34.5"></script>
  <script src="ui-common.js?v=34.5"></script>
  <script src="body-age.js?v=34.5"></script>
  <script src="activity-core.js?v=34.5"></script>
  <script src="activity-form.js?v=34.5"></script>
  <script src="gear-utils.js?v=34.5"></script>
  <script src="chart-utils.js?v=34.5"></script>
  <script src="view-overview.js?v=34.5"></script>
  <script src="view-activities.js?v=34.5"></script>
  <script src="view-body.js?v=34.5"></script>
  <script src="view-gear.js?v=34.5"></script>
  <script src="view-routes.js?v=34.5"></script>
  <script src="view-plans.js?v=34.5"></script>
  <script src="view-reports.js?v=34.5"></script>
  <script src="recommend-core.js?v=34.5"></script>
  <script src="app.js?v=34.5"></script>
</body>
</html>
